[package]
name = "todo-app"
version = "4.2.7"
description = "BankoSpace - Modern productivity application"
authors = ["berkbankoglu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["unstable"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
urlencoding = "2.1"
tauri-plugin-shell = "2.0"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = "0.32"

# WebView2 renderer çökmesinden otomatik kurtarma (ProcessFailed → Reload).
# Sürüm, tauri'nin kullandığı wry ile aynı webview2-com sürümü olmalı (Cargo.lock: 0.38).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
