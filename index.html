</head>
<body style="margin:0;padding:0;height:100%;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box;">

    <script type="module" src="/src/main.jsx"></script>

</html>
